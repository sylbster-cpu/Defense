<script>
'use strict';
(() => {
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d',{alpha:false});
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.max(0,Math.min(+r||0,w/2,h/2));this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();};}
const $=id=>document.getElementById(id);
// Lane geometry in world units. The rules and both renderers read these; LEAK_Y sets the lane length.
const LANE_TOP=99,LEAK_Y=608,DRONE_Y=340,TURRET_Y=489,LANE_LEN=LEAK_Y-LANE_TOP,DY=LEAK_Y-506;
const W=480,H=600+DY,LANES=[139,341];
const COLORS={amber:'#edbf76',teal:'#84d8d0',red:'#f17c6f',pale:'#eae9dc',green:'#a6d4a9'};
// Wide-phone rendering is visual only. The game still simulates exactly the same two lanes.
let compactCanvas=false,compactRatio=1,compactW=W,compactH=H,canvasModeKey='',classicSX=1,classicSY=1;
function wantsCompactCanvas(){return innerWidth>innerHeight&&innerHeight<=520&&innerWidth<=1100;}
function syncCanvasMode(){
 const compact=wantsCompactCanvas(),box=canvas.getBoundingClientRect(),dpr=Math.min(3,window.devicePixelRatio||1);
 const key=(compact?'wide:':'classic:')+Math.round(box.width)+':'+Math.round(box.height)+':'+dpr;
 if(key===canvasModeKey)return;
 canvasModeKey=key;compactCanvas=compact;compactRatio=compact?dpr:1;
 if(compact){canvas.width=Math.max(1,Math.round(box.width*dpr));canvas.height=Math.max(1,Math.round(box.height*dpr));compactW=canvas.width/dpr;compactH=canvas.height/dpr;}
 else{
  // Draw the portrait field at the size it is shown, so it stays sharp on dense screens.
  const s=Math.max(.5,Math.min(3,Math.min(box.width/W,box.height/H)*dpr||1));
  canvas.width=Math.round(W*s);canvas.height=Math.round(H*s);classicSX=canvas.width/W;classicSY=canvas.height/H;compactW=W;compactH=H;}
 canvas.classList.toggle('compact-landscape',compact);
 canvas.setAttribute('aria-label',compact?'두 개의 가로 전선. 위쪽이 발전소, 아래쪽이 정비소. 화면 위아래를 터치하여 지원 기체를 이동합니다.':'두 개의 세로 전선. 왼쪽이 발전소, 오른쪽이 정비소. 화면 좌우를 터치하여 지원 기체를 이동합니다.');
 $('leftBtn').querySelector('.ico').textContent=compact?'↑':'↙';
 $('rightBtn').querySelector('.ico').textContent=compact?'↓':'↘';
 $('leftBtn').querySelector('.sub').textContent=compact?'위쪽 · A':'왼쪽 · A';
 $('rightBtn').querySelector('.sub').textContent=compact?'아래쪽 · D':'오른쪽 · D';
 const minView=compact&&innerWidth<=500&&innerHeight<=340;
 $('operationStat').previousElementSibling.textContent=minView?'작전':'OPERATION';
 $('waveStat').previousElementSibling.textContent=minView?'파':'WAVE';
}

let phase='intro',op=1,wave=0,stageTime=0, speed=1,paused=false,lastTime=0,uiClock=0;
let core=100,facilities=[100,100],turrets=[],enemies=[],shots=[],particles=[],alerts=[];
let drone={lane:0,x:LANES[0],y:DRONE_Y,moveCooldown:0,shotCooldown:0, pulseCooldown:0,stay:0,burst:0,echoLane:0,echoCool:0};
let pattern=[],nextSpawn=0,kills=0,leaks=0,switches=0,stageReports=[],upgradeHistory=[],upgradeRanks={stable:0,emergency:0,precision:0,rubble:0},offeredUpgrades=[];
// Balance numbers in one place. Card values are read by the upgrade screen text, so the text never drifts from the rule.
const BAL={droneRange:155,droneDmg:19,droneRate:.29,turretDmg:14,turretRate:.52,turretRange:165,moveBase:2.2,pulseRange:110,pulseDamage:75,pulseBase:11,pulseStun:.5,powerDownMove:1.5,shopDownTurret:1.35,opHeal:15,preview:5,
 card:{
  // From rank 3 a card gains an effect that lower ranks do not have.
  // stable (echo): during the post-move burst the extra shots go to the lane the drone just left, while that lane has a target in range.
  // precision (pierce): turrets at the full bonus also hit the enemy behind their target.
  stable:n=>({moveBase:Math.max(.55,1.5-.3*(n-1)),droneRange:BAL.droneRange+15+15*(n-1),burstTime:1.0+.7*(n-1),burstRate:1.6,echo:n>=3?1:0}),
  precision:n=>({focusRamp:.25+.05*(n-1),focusCap:.6+.5*(n-1),pierce:n>=3?.3+.15*(n-3):0}),
  emergency:n=>({pulseDamage:110+30*(n-1),pulseRange:165+20*(n-1),pulseBase:9,refund:1.4+.5*(n-1),pulseMin:3}),
  rubble:n=>({rubbleSlow:2+1.2*(n-1),rubbleFactor:Math.max(.25,.55-.08*(n-1))})
 }};
function baseEffects(){return{droneRange:BAL.droneRange,moveBase:BAL.moveBase,pulseDamage:BAL.pulseDamage,pulseBase:BAL.pulseBase,pulseRange:BAL.pulseRange,burstTime:0,burstRate:1,echo:0,focusRamp:0,focusCap:0,pierce:0,refund:0,pulseMin:BAL.pulseBase,rubble:0,rubbleSlow:0,rubbleFactor:1};}
// Both turrets speed up while the drone holds one lane; moving resets the bonus.
// A same-lane-only bonus was tested and stayed weak: leaks come from the lane the drone is not covering.
function focusBonus(){return effects.focusCap>0?Math.min(effects.focusCap,effects.focusRamp*drone.stay):0;}
function pierceOn(){return effects.pierce>0&&effects.focusRamp*drone.stay>=effects.focusCap;}
function echoOn(){return effects.echo>0&&drone.burst>0&&drone.echoLane!==drone.lane;}
let effects=baseEffects(),surges=[];
// Shown on the first and the result screens. Change it with every published build.
const BUILD='2026.11.10-3';
// Bridge for the 2.5D renderer in r3d/. It only reads game state; rules stay in this file.
// Discrete moments (a hit, a kill, a leak...) are queued in G3.events while the renderer is active.
const G3={BUILD,active:false,renderer:null,events:[]};
function ev3(o){if(G3.active){G3.events.push(o);if(G3.events.length>500)G3.events.splice(0,250);}}
let audio=null,mute=false,toastExpiry=0,frameTime=0,logLines=[];
const TYPES={runner:{hp:50,speed:84,power:13,baseDamage:6,r:10,color:'#e3b65e',value:1},grunt:{hp:105,speed:58,power:19,baseDamage:9,r:13,color:'#dc876f',value:2},brute:{hp:205,speed:37,power:30,baseDamage:15,r:17,color:'#b86562',value:3},boss:{hp:400,speed:24,power:42,baseDamage:21,r:23,color:'#de9e80',value:4}};
// Enemy schedule: [time, lane(0 power / 1 workshop), type] rows, built from a few wave shapes so that
// each operation asks for a different way of playing.
//  pack = tight group in one lane (overload)      row  = steady single file in one lane (holding)
//  zig  = groups alternating between the lanes (moving)
//  both = the same enemy in both lanes at once (a surge one drone cannot cover)
//  meet = a slow leader plus faster followers timed to close up behind it beside the drone, so mixed speeds arrive as one clump
const R='runner',G='grunt',B='brute',X='boss',MEET_AT=DRONE_Y-92;
const pack=(t,l,types,gap=.45)=>types.map((ty,i)=>[t+i*gap,l,ty]);
const row=(t,l,types,gap=1.4)=>pack(t,l,types,gap);
const zig=(t,l,groups,gap=2.6)=>groups.flatMap((g,i)=>pack(t+i*gap,(l+i)%2,g));
const both=(t,ty)=>[[t,0,ty],[t,1,ty]];
const meet=(t,l,lead,followers,gap=.4)=>[[t,l,lead],...followers.map((ty,i)=>[t+MEET_AT/TYPES[lead].speed-MEET_AT/TYPES[ty].speed+(i+1)*gap,l,ty])];
// Three waves per operation; times inside a wave are relative to its section of `len` seconds.
function combineWaves(len,parts){return parts.flatMap((part,i)=>part.flat().map(([t,l,type])=>[+(t+len*i).toFixed(2),l,type])).sort((a,b)=>a[0]-b[0]);}
const TOTAL_OPS=5;
const stages={
 // 1 첫 대응: one gentle example of each shape.
 1:combineWaves(17,[
  [zig(.6,0,[[R],[G],[G],[R]],2.2),pack(10.5,0,[G,G,G],.5),[[13.5,1,R]]],
  [meet(.5,1,B,[G,G,R]),row(1.5,0,[R,G],4),pack(10,0,[G,G,G]),[[12.5,1,G]]],
  [both(.5,B),row(4,0,[G,G,G,G],1.1),pack(8.1,1,[R,R],.5),meet(11,1,B,[G,R])]
 ]),
 // 2 전선 집중: long single files, one lane at a time.
 2:combineWaves(18,[
  [row(.5,0,[G,G,B,G,G],1.5),[[2.75,1,R]],[[7.3,1,R]],pack(11,1,[G,G,G]),[[13,0,R]]],
  [row(.5,1,[B,G,G,G,B],1.5),pack(5.5,0,[R,R,R],.4),meet(10.5,0,B,[G,G,R])],
  [both(.5,B),meet(4.5,1,B,[G,G,G,R]),row(6,0,[G,G,G],1.2),both(13,R)]
 ]),
 // 3 동시 포위: both lanes at once, then the first boss.
 3:combineWaves(22,[
  [both(.7,R),both(3,G),meet(6.5,0,B,[G,G,R]),meet(9.5,1,B,[G,G,R]),both(16,R)],
  [both(.8,B),pack(4,0,[G,G,G]),pack(4.3,1,[R,R,R],.4),both(9,G),meet(12,1,B,[G,G,R])],
  [[[.8,0,X]],pack(2,1,[G,G],.5),pack(6.5,1,[R,R,R],.4),[[10,1,B]],pack(13,1,[G,G],.5),[[13.5,0,G]],both(17.5,R)]
 ]),
 // 4 교차 압박: groups alternate between the lanes.
 4:combineWaves(22,[
  [zig(.6,0,[[R,R,R],[G,G],[R,R,R],[G,G,B]],2.6),[[12.5,0,B]],pack(14,1,[R,R],.4)],
  [meet(.6,1,B,[G,G,R]),meet(4.6,0,B,[G,G,R]),meet(8.6,1,B,[G,R,R]),[[1.6,0,R]],[[14,0,G]],[[15.5,1,G]]],
  [[[.6,1,X]],zig(2,0,[[G,G],[R,R],[G,G,G],[R,R]],2.6),both(13,B),both(16.5,R)]
 ]),
 // 5 최후 방어: every shape under pressure.
 5:combineWaves(22,[
  [row(.7,0,[G,B,G,G],1.6),meet(3,1,B,[G,G,R]),pack(11,1,[R,R,R],.4),both(16.5,G)],
  [meet(.7,0,B,[G,G,R]),meet(3.7,1,B,[G,G,R]),zig(9,0,[[R,R],[G,G],[R,R]],2.4),both(17,B)],
  [[[.8,1,X]],pack(1.4,0,[G,G],.7),meet(6,0,B,[G,R]),pack(8,1,[G,G],.7),both(12.6,R),[[17,0,G]],[[18,1,R]]]
 ])
};
const WAVES={1:[17,34],2:[18,36],3:[22,44],4:[22,44],5:[22,44]};
const OP_NAMES=['','첫 대응','전선 집중','동시 포위','교차 압박','최후 방어'];
function findSurges(p){const out=[];for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++){if(p[i][1]!==p[j][1]&&Math.abs(p[i][0]-p[j][0])<=.7&&(p[i][2]!=='runner'||p[j][2]!=='runner')){const t=Math.min(p[i][0],p[j][0]);if(!out.some(s=>Math.abs(s.t-t)<4))out.push({t,said:false});}}return out.sort((a,b)=>a.t-b.t);}
function reset(){op=1;wave=0;stageTime=0;speed=1;paused=false;core=100;facilities=[100,100];turrets=[];enemies=[];shots=[];particles=[];alerts=[];drone={lane:0,x:LANES[0],y:DRONE_Y,moveCooldown:0,shotCooldown:0,pulseCooldown:0,stay:0,burst:0,echoLane:0,echoCool:0};nextSpawn=0;kills=0;leaks=0;switches=0;stageReports=[];upgradeHistory=[];upgradeRanks={stable:0,emergency:0,precision:0,rubble:0};offeredUpgrades=[];effects=baseEffects();surges=[];$('speedBtn').textContent='속도 ×1';logLines=[];addLog('방어 기지에 신호가 연결되었습니다.');}
function newStage(index){op=index;wave=1;stageTime=0;nextSpawn=0;enemies=[];shots=[];particles=[];alerts=[];facilities=[100,100];core=Math.min(100,core+(index>1?BAL.opHeal:0));drone.moveCooldown=0;drone.shotCooldown=0;drone.pulseCooldown=0;drone.stay=0;drone.burst=0;drone.echoLane=0;drone.echoCool=0;drone.lane=0;drone.x=LANES[0];turrets=[{lane:0,x:LANES[0],y:TURRET_Y,cool:0,flash:0},{lane:1,x:LANES[1],y:TURRET_Y,cool:0,flash:0}];pattern=stages[index].slice();surges=findSurges(pattern);phase='battle';paused=false;ev3({t:'stage',op:index});showOverlay(false);hideCoach();showToast('작전 '+String(index).padStart(2,'0')+' · '+OP_NAMES[index],2200);addLog(OP_NAMES[index]+' 작전 개시.');updateControls();updateUI();}

function burst(x,y,n,color){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=24+Math.random()*80;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:1+Math.random()*3,life:.25+Math.random()*.42,color});}if(particles.length>180)particles.splice(0,particles.length-180);}

function switchLane(lane){if(phase==='practice'){if(practice.task!=='move'||practice.done)return;}else if(phase!=='battle'||paused)return;if(drone.lane===lane)return;if(drone.moveCooldown>.02){showToast('이동 장치 재충전 중',750);return;}const from=drone.lane;drone.lane=lane;drone.stay=0;drone.burst=effects.burstTime;drone.echoLane=from;drone.echoCool=BAL.droneRate;drone.moveCooldown=effects.moveBase*(phase==='battle'&&facilities[0]<=0?BAL.powerDownMove:1);if(phase==='battle')switches++;ev3({t:'move',from,to:lane,rubble:phase==='battle'&&!!effects.rubble});
 if(phase==='battle'&&effects.rubble){for(const e of enemies)if(e.lane===from&&e.hp>0)e.slow=effects.rubbleSlow;alerts.push({lane:from,y:drone.y,life:.6,r:12});burst(LANES[from],drone.y,16,'#c9a27a');}burst(drone.x,drone.y,10,COLORS.teal);sound(510,.13,'sine',.035);addLog((lane===0?'발전소':'정비소')+' 방어선으로 지원 기체 이동.');if(phase==='practice')practiceDone();updateControls();}

function enemyLeak(e){const d=TYPES[e.type];leaks++;const lane=e.lane;const before=facilities[lane];facilities[lane]=Math.max(0,facilities[lane]-d.power);ev3({t:'leak',lane,type:e.type,down:before>0&&facilities[lane]<=0});const coreDamage=before>0?d.baseDamage:Math.ceil(d.baseDamage*1.7);core=Math.max(0,core-coreDamage);burst(e.x,LEAK_Y+3,15,'#f1a077');sound(150,.25,'sawtooth',.09);if(before>0&&facilities[lane]<=0){addLog((lane===0?'발전소':'정비소')+' 기능 정지! 방어선이 붕괴했습니다.');showToast(lane===0?'발전소 기능 정지 · 기체 이동 느려짐':'정비소 기능 정지 · 포탑 사격 느려짐',2200);}else if(e.type==='boss')addLog('거대 병기가 방어선을 돌파했습니다.');}
function update(dt){stageTime+=dt;const prevWave=wave;wave=waveIndex(stageTime);if(wave!==prevWave){ev3({t:'wave',wave});showToast('제'+wave+'파 공격 시작',1600);addLog('제'+wave+'파 공격 감지.');}

function cardDescription(id){const n=upgradeRanks[id]+1,a=BAL.card[id](n),b=n>1?BAL.card[id](n-1):null,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2),pc=v=>Math.round(v*100)+'%';
 switch(id){
 case 'stable':return (!b?`이동 대기 ${BAL.moveBase}초 → ${f1(a.moveBase)}초 · 이동 후 ${f1(a.burstTime)}초간 기체 공격 속도 ×${a.burstRate} · 사거리 +${a.droneRange-BAL.droneRange}`:`이동 대기 ${f2(b.moveBase)} → ${f2(a.moveBase)}초 · 이동 후 강화 ${f1(b.burstTime)} → ${f1(a.burstTime)}초 · 사거리 +${a.droneRange-b.droneRange}`)+(n<3?' · 3단계부터 강화 중 떠난 전선도 사격':n===3?' · 새 효과: 강화 중 늘어난 사격이 떠난 전선의 적을 공격':' · 떠난 전선 사격 시간도 함께 늘어남');

 case 'precision':return (!b?`기체가 한 전선에 머무는 동안 양쪽 포탑이 1초마다 +${pc(a.focusRamp)}씩 빨라짐 (최대 +${pc(a.focusCap)}) · 기체가 이동하면 처음부터`:`최대 +${pc(b.focusCap)} → +${pc(a.focusCap)} · 1초마다 +${pc(b.focusRamp)} → +${pc(a.focusRamp)}`)+(n<3?' · 3단계부터 최대일 때 포탑 관통':n===3?` · 새 효과: 가속이 최대일 때 포탑이 뒤의 적 1기도 공격 (피해 ${pc(a.pierce)})`:` · 관통 피해 ${pc(b.pierce)} → ${pc(a.pierce)}`);

 const alternatives=['stable','emergency','precision','rubble'].filter(id=>!facilityOffers.includes(id));

function choose(id){if(phase!=='upgrade'||!offeredUpgrades.includes(id)||!BAL.card[id])return;const n=++upgradeRanks[id];

   if(hp>0){if(gold){line(xEnd-4,y-6,xEnd+2,y-1,base,2.5);line(xEnd+2,y-1,xEnd-3,y+7,base,2.5);}else{line(xEnd-6,y-5,xEnd+6,y+5,base,2.5);line(xEnd-6,y+5,xEnd+6,y-5,base,2.5);}}
   else{line(xEnd-6,y-6,xEnd+6,y+6,'#dd8270',3);line(xEnd-6,y+6,xEnd+6,y-6,'#dd8270',3);}
   rounded(xEnd-23,y+18*scale,46,4,2,'#101b20');rect(xEnd-22,y+19*scale,44*progress,2,base);
   text(label,xEnd,y-rowGap*.30,Math.max(10,12*scale),hp>0?'#e8ece5':'#e58a79','center',true);
 }
 // The communication hub visually connects both protected facilities.
 const hubX=w-11,hubY=(ys[0]+ys[1])/2;
 line(xEnd+15,ys[0],hubX-7,hubY,'#578b84',1.2);
 line(xEnd+15,ys[1],hubX-7,hubY,'#578b84',1.2);
 circle(hubX-4,hubY,7,core>0?'#477e72':'#7e4641','#a0cdb6',1.2);
 // Header is compact and stays out of the incoming enemies.
 text('작전 '+String(op).padStart(2,'0')+' / 05',8,13,Math.max(10,11*scale),'#e8ddd0','left',true);
 text('공격 '+(noWave()?'—':wave)+' / 03',w-8,13,Math.max(10,11*scale),'#e8ddd0','right',true);
 // Preview the next five seconds of arrivals in each lane without using tiny top-of-canvas icons.
 if(phase==='battle'){
  const warn=surges.some(s=>s.t-stageTime>=-.3&&s.t-stageTime<=3.5);
  for(let lane=0;lane<2;lane++){
   const next=[];for(let i=nextSpawn;i<pattern.length;i++){const ev=pattern[i];if(ev[0]-stageTime>BAL.preview)break;if(ev[1]===lane)next.push(ev);if(next.length>=4)break;}
   const y=ys[lane],y0=y-rowGap*.31;
   if(warn)rounded(3,y-rowGap*.43,w-6,rowGap*.86,6,null,'#ef8371',1.7);
   next.forEach((ev,i)=>{
    const x=10+i*(11*scale+6),pr=Math.max(0,Math.min(1,1-(ev[0]-stageTime)/BAL.preview));
    const color=TYPES[ev[2]].color;
    circle(x+4*scale,y0,4*scale,color,'#422f30',1);
    rounded(x,y0+6*scale,9*scale,2*scale,1,'#425455');
    rect(x,y0+6*scale,9*scale*pr,2*scale,'#f3cf8f');
   });
  }
 }
 // Incoming enemies and their health. Large geometry is intentionally consistent between phones.
 for(const e of enemies){
  const x=px(e.y),y=ys[e.lane],unit=({runner:8,grunt:10.5,brute:13.5,boss:17.5}[e.type])*scale;
  const color=e.flash>0?'#fff9df':TYPES[e.type].color;
  circle(x+1,y+2,unit+2,'rgba(0,0,0,.24)');
  if(e.type==='runner'){
   ctx.beginPath();ctx.moveTo(x+unit,y);ctx.lineTo(x-unit*.72,y-unit*.85);ctx.lineTo(x-unit*.43,y);ctx.lineTo(x-unit*.72,y+unit*.85);ctx.closePath();ctx.fillStyle=color;ctx.fill();
   line(x-unit*.4,y,x+unit*.4,y,'#684838',1.8);
  }else if(e.type==='grunt'){
   rounded(x-unit,y-unit,unit*2,unit*2,4,color,'#6e4741',1.5);
   line(x-unit*.4,y-2,x+unit*.4,y-2,'#7c5347',2);
  }else{
   rounded(x-unit,y-unit,unit*2,unit*2,6,'#70454a','#ebb18e',2);
   rounded(x-unit+3,y-unit+3,2*unit-6,2*unit-6,3,color,'#825048',1.2);
   if(e.type==='boss')circle(x,y,unit*.35,'#ffe2a9','#825248',1);
  }
  if(e.slow>0){ctx.save();ctx.setLineDash([3,3]);circle(x,y,unit+5,null,'#f1c07d',1.5);ctx.restore();}
  const barWidth=unit*2+6;
  rounded(x-barWidth/2,y-unit-10*scale,barWidth,4,2,'#111e22');
  rect(x-barWidth/2+1,y-unit-9*scale,(barWidth-2)*Math.max(0,e.hp/e.maxHp),2,'#f3cf90');
 }
 // The turrets keep their exact simulated positions but use much larger readable silhouettes.
 for(const turret of turrets){
  const x=px(turret.y),y=ys[turret.lane];
  circle(x,y,14*scale,'#223b42','#9dbdb5',1.8);
  rounded(x-12*scale,y-7*scale,18*scale,14*scale,3,'#537783','#9ad2cc',1.2);
  rounded(x-17*scale,y-3*scale,10*scale,6*scale,2,turret.flash>0?'#fff2ad':'#f2d7a4');
  circle(x,y,4*scale,'#e0caa3');
  const fb=focusBonus();
  if(fb>0){ctx.save();ctx.beginPath();ctx.arc(x,y,18*scale,-Math.PI/2,-Math.PI/2+Math.PI*2*fb/effects.focusCap);ctx.strokeStyle='#f0c47b';ctx.lineWidth=2.5;ctx.stroke();ctx.restore();text('+'+Math.round(fb*100)+'%'+(pierceOn()?' 관통':''),x,y+(turret.lane===0?-28:30)*scale,Math.max(10,11*scale),'#f0c47b','center',true);}
 }
 // The support drone moves between the two rows as the old horizontal movement interpolates.
 const droneX=px(drone.y),droneY=py(drone.x);
 const reach=effects.pulseRange/LANE_LEN*run;
 if((phase==='battle'||phase==='practice')&&drone.pulseCooldown<=.01){
  ctx.save();ctx.setLineDash([5,5]);ctx.beginPath();ctx.ellipse(droneX,droneY,Math.max(22,reach),Math.max(12,14*scale),0,0,Math.PI*2);ctx.strokeStyle='rgba(240,196,123,.85)';ctx.lineWidth=1.7;ctx.stroke();ctx.restore();
 }
 circle(droneX,droneY,20*scale,'rgba(113,201,182,.12)','#73b8ad',1.6);
 if(drone.burst>0)circle(droneX,droneY,26*scale,null,'rgba(150,240,215,'+(.35+.5*Math.min(1,drone.burst))+')',2.5);
 if(echoOn()){const gy=ys[drone.echoLane];ctx.save();ctx.globalAlpha=.3+.4*Math.min(1,drone.burst);ctx.setLineDash([4,4]);circle(droneX,gy,18*scale,null,'#96f0d7',1.8);ctx.setLineDash([]);ctx.translate(droneX,gy);ctx.rotate(Math.PI/4);rounded(-9*scale,-9*scale,18*scale,18*scale,3,null,'#96f0d7',1.8);ctx.restore();}
 ctx.save();ctx.translate(droneX,droneY);ctx.rotate(Math.PI/4);
 rounded(-12*scale,-12*scale,24*scale,24*scale,4,'#77b9ad','#ccebd6',2);
 rounded(-6*scale,-6*scale,12*scale,12*scale,2,'#244b50');ctx.restore();
 circle(droneX,droneY,4*scale,'#f4d5a0');
 // Tracers, explosion rings and particles share the same coordinate projection.
 for(const shot of shots){const a=map(shot.x,shot.y),b=map(shot.x2,shot.y2);ctx.globalAlpha=Math.min(1,shot.life/.13);line(a[0],a[1],b[0],b[1],'#fce6ab',Math.max(1.4,shot.thick*scale));}
 ctx.globalAlpha=1;
 for(const ring of alerts){const x=px(ring.y),y=ys[ring.lane];ctx.globalAlpha=Math.max(0,ring.life/.48);circle(x,y,Math.max(4,ring.r*.55*scale),null,'#ffe1aa',2.5);}
 ctx.globalAlpha=1;
 for(const p of particles){const xy=map(p.x,p.y);ctx.globalAlpha=Math.min(1,p.life*2.3);circle(xy[0],xy[1],Math.max(1.3,p.r*scale),p.color);}
 ctx.globalAlpha=1;
 // Tutorial demonstrates the real control on this layout; tap target remains the entire row.
 if(phase==='practice'&&!practice.done){
  if(practice.task==='move'){
   const t=(now%1000)/1000,x=droneX+32*scale,y=droneY+20*scale+t*25;
   line(x,y,x,y+21,'#f0c47b',3);line(x-7,y+14,x,y+21,'#f0c47b',3);line(x+7,y+14,x,y+21,'#f0c47b',3);
  }else{const t=(now%1000)/1000;ctx.globalAlpha=.7*(1-t);ctx.beginPath();ctx.ellipse(droneX,droneY,20+t*50,10+t*9,0,0,Math.PI*2);ctx.strokeStyle='#ffe1aa';ctx.lineWidth=3;ctx.stroke();ctx.globalAlpha=1;}
 }
 if(paused&&phase==='battle'){
  rect(0,0,w,h,'rgba(8,18,22,.67)');text('일시정지',w/2,h/2,25,'#ffe1ae','center',true);
 }
}
function draw(now){syncCanvasMode();if(G3.active){try{G3.renderer.frame(now);return;}catch(e){console.warn('2.5D view stopped; using the 2D canvas.',e);G3.active=false;$('field').classList.remove('r3d-on');}}if(compactCanvas){drawCompact(now);return;}ctx.setTransform(classicSX,0,0,classicSY,0,0);drawBackdrop(now);drawIncoming();drawStations(now);drawTurrets(now);for(const e of enemies)drawEnemy(e,now);drawDrone(now);drawPracticeHint(now);drawVfx();if(paused&&phase==='battle'){rect(0,61,480,H-61,'rgba(7,18,22,.65)');text('일시정지',240,DRONE_Y-8,31,'#f0d1a1','center',true);}}
function loop(timestamp){let dt=Math.min(.05,(timestamp-lastTime)/1000||0);lastTime=timestamp;frameTime=timestamp;if(phase==='battle'&&!paused)update(dt*speed);else if(phase==='practice')updatePractice(dt);draw(timestamp);if(timestamp-toastExpiry>0)$('toast').classList.remove('show');uiClock+=dt;if(uiClock>.12){updateUI();uiClock=0;}requestAnimationFrame(loop);}
$('leftBtn').addEventListener('click',()=>switchLane(0));$('rightBtn').addEventListener('click',()=>switchLane(1));$('pulseBtn').addEventListener('click',pulse);
function fieldTap(ev){if(phase!=='battle'&&phase!=='practice')return;const rect=canvas.getBoundingClientRect();if(compactCanvas){switchLane((ev.clientY-rect.top)<rect.height/2?0:1);}else{const x=(ev.clientX-rect.left)/rect.width*W;switchLane(x<W/2?0:1);}}
canvas.addEventListener('pointerdown',fieldTap);
$('speedBtn').addEventListener('click',()=>{if(phase!=='battle')return;speed=speed===1?2:1;$('speedBtn').textContent='속도 ×'+speed;});
$('pauseBtn').addEventListener('click',()=>{if(phase!=='battle')return;paused=!paused;addLog(paused?'전투 일시정지.':'전투 재개.');updateControls();});
window.addEventListener('keydown',ev=>{if(phase!=='battle'&&phase!=='practice')return;const k=ev.key.toLowerCase();if(['arrowleft','arrowright',' ','a','d','p','f'].includes(k))ev.preventDefault();if(k==='a'||k==='arrowleft')switchLane(0);if(k==='d'||k==='arrowright')switchLane(1);if(k===' '||k==='f')pulse();if(k==='p'){$('pauseBtn').click();}});
window.addEventListener('blur',()=>{if(phase==='battle'&&!paused){paused=true;updateControls();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='battle'&&!paused){paused=true;updateControls();}});
// 2.5D view (r3d/): loaded only when WebGL exists. If a script or the renderer fails, the 2D canvas keeps working. ?2d=1 forces 2D.
Object.assign(G3,{W,H,LANES,LANE_TOP,LEAK_Y,DRONE_Y,TURRET_Y,LANE_LEN,BAL,TYPES,COLORS,focusBonus,pierceOn,echoOn,noWave,compact:wantsCompactCanvas});
Object.defineProperties(G3,{phase:{get:()=>phase},op:{get:()=>op},wave:{get:()=>wave},stageTime:{get:()=>stageTime},paused:{get:()=>paused},speed:{get:()=>speed},core:{get:()=>core},facilities:{get:()=>facilities},turrets:{get:()=>turrets},enemies:{get:()=>enemies},drone:{get:()=>drone},effects:{get:()=>effects},pattern:{get:()=>pattern},nextSpawn:{get:()=>nextSpawn},surges:{get:()=>surges},practice:{get:()=>practice},ranks:{get:()=>upgradeRanks}});
window.__relay=G3;
(function load3d(){if(/[?&]2d\b/.test(location.search)||!window.WebGLRenderingContext)return;
 const files=['three.min.js','core.js','env.js','base.js','units.js','fx.js','hud.js'];let i=0;
 (function next(){
  if(i>=files.length){try{const api=window.R3D&&window.R3D.boot(G3,$('field'));if(api){G3.renderer=api;G3.active=true;$('field').classList.add('r3d-on');api.hudCanvas.addEventListener('pointerdown',fieldTap);}}catch(e){console.warn('2.5D view unavailable; using the 2D canvas.',e);}return;}
  const s=document.createElement('script');s.src='r3d/'+files[i++]+'?v='+BUILD;s.onload=next;s.onerror=()=>console.warn('2.5D view unavailable; using the 2D canvas.');document.head.appendChild(s);})();
})();
reset();intro();updateUI();requestAnimationFrame(loop);
})();
