<script>
'use strict';
(() => {
const canvas=document.getElementById('game');

const $=id=>document.getElementById(id);
// Lane geometry in world units. The rules and both renderers read these; LEAK_Y sets the lane length.
const LANE_TOP=99,LEAK_Y=608,DRONE_Y=340,TURRET_Y=489,LANE_LEN=LEAK_Y-LANE_TOP,DY=LEAK_Y-506;
const W=480,H=600+DY,LANES=[139,341];
const COLORS={amber:'#edbf76',teal:'#84d8d0',red:'#f17c6f',pale:'#eae9dc',green:'#a6d4a9'};
// Wide-phone rendering is visual only. The game still simulates exactly the same two lanes.
let compactCanvas=false,compactRatio=1,compactW=W,compactH=H,canvasModeKey='',classicSX=1,classicSY=1;
function wantsCompactCanvas(){return innerWidth>innerHeight;}
function syncCanvasMode(){
 const compact=wantsCompactCanvas(),box=canvas.getBoundingClientRect(),dpr=Math.min(3,window.devicePixelRatio||1);
 const key=(compact?'wide:':'classic:')+Math.round(box.width)+':'+Math.round(box.height)+':'+dpr;
 if(key===canvasModeKey)return;
 canvasModeKey=key;compactCanvas=compact;compactRatio=compact?dpr:1;
 if(compact){canvas.width=Math.max(1,Math.round(box.width*dpr));canvas.height=Math.max(1,Math.round(box.height*dpr));compactW=canvas.width/dpr;compactH=canvas.height/dpr;}
 else{
  // Draw the portrait field at the size it is shown, so it stays sharp on dense screens.
  const s=Math.max(.5,Math.min(3,Math.min(box.width/W,box.height/H)*dpr||1));
  canvas.width=Math.round(W*s);canvas.height=Math.round(H*s);classicSX=canvas.width/W;classicSY=canvas.height/H;compactW=W;compactH=H;}
 canvas.classList.toggle('compact-landscape',compact);
 canvas.setAttribute('aria-label',compact?'두 개의 가로 전선. 위쪽이 발전소, 아래쪽이 정비소. 화면 위아래를 터치하여 지원 기체를 이동합니다.':'두 개의 세로 전선. 왼쪽이 발전소, 오른쪽이 정비소. 화면 좌우를 터치하여 지원 기체를 이동합니다.');

// Incoming preview: next spawns per lane in the header, with a fill bar that completes on arrival; red frame before a surge.
function drawIncoming(){if(phase!=='battle')return;const soon=[[],[]];for(let i=nextSpawn;i<pattern.length;i++){const ev=pattern[i],d=ev[0]-stageTime;if(d>BAL.preview)break;soon[ev[1]].push([d,ev[2]]);}

 // The communication hub visually connects both protected facilities.

 // Header is compact and stays out of the incoming enemies.

   const y=ys[lane],y0=y-rowGap*.31;

   });
  }
 }
 // Incoming enemies and their health. Large geometry is intentionally consistent between phones.
 for(const e of enemies){
  const x=px(e.y),y=ys[e.lane],unit=({runner:8,grunt:10.5,brute:13.5,boss:17.5}[e.type])*scale;
  const color=e.flash>0?'#fff9df':TYPES[e.type].color;
  circle(x+1,y+2,unit+2,'rgba(0,0,0,.24)');
  if(e.type==='runner'){
   ctx.beginPath();ctx.moveTo(x+unit,y);ctx.lineTo(x-unit*.72,y-unit*.85);ctx.lineTo(x-unit*.43,y);ctx.lineTo(x-unit*.72,y+unit*.85);ctx.closePath();ctx.fillStyle=color;ctx.fill();
   line(x-unit*.4,y,x+unit*.4,y,'#684838',1.8);
  }else if(e.type==='grunt'){
   rounded(x-unit,y-unit,unit*2,unit*2,4,color,'#6e4741',1.5);
   line(x-unit*.4,y-2,x+unit*.4,y-2,'#7c5347',2);
  }else{
   rounded(x-unit,y-unit,unit*2,unit*2,6,'#70454a','#ebb18e',2);
   rounded(x-unit+3,y-unit+3,2*unit-6,2*unit-6,3,color,'#825048',1.2);
   if(e.type==='boss')circle(x,y,unit*.35,'#ffe2a9','#825248',1);
  }
  if(e.slow>0){ctx.save();ctx.setLineDash([3,3]);circle(x,y,unit+5,null,'#f1c07d',1.5);ctx.restore();}

 }
 for(const f of fieldTurrets){const x=px(f.y),y=ys[f.lane];circle(x,y,9*scale,'#223b42','#d7c7a1',1.5);circle(x,y,3.5*scale,f.flash>0?'#fff2ad':'#e0caa3');ctx.save();ctx.beginPath();ctx.arc(x,y,12*scale,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,f.life/FIELD.life));ctx.strokeStyle='#f0c47b';ctx.lineWidth=2;ctx.stroke();ctx.restore();}
 // The turrets keep their exact simulated positions but use much larger readable silhouettes.
 for(const turret of turrets){
  const x=px(turret.y),y=ys[turret.lane];
  circle(x,y,14*scale,'#223b42','#9dbdb5',1.8);

  if(fb>0){ctx.save();ctx.beginPath();ctx.arc(x,y,18*scale,-Math.PI/2,-Math.PI/2+Math.PI*2*fb/effects.focusCap);ctx.strokeStyle='#f0c47b';ctx.lineWidth=2.5;ctx.stroke();ctx.restore();text('+'+Math.round(fb*100)+'%'+(pierceOn()?' 관통':''),x,y+(turret.lane===0?-28:30)*scale,Math.max(10,11*scale),'#f0c47b','center',true);}
 }
 // The support drone moves between the two rows as the old horizontal movement interpolates.
 const droneX=px(drone.y),droneY=py(drone.x);
 const reach=effects.pulseRange/LANE_LEN*run;
 if(phase==='battle'&&!drill&&!pulseLock&&drone.pulseCooldown<=.01){
  ctx.save();ctx.setLineDash([5,5]);ctx.beginPath();ctx.ellipse(droneX,droneY,Math.max(22,reach),Math.max(12,14*scale),0,0,Math.PI*2);ctx.strokeStyle='rgba(240,196,123,.85)';ctx.lineWidth=1.7;ctx.stroke();ctx.restore();
 }
 circle(droneX,droneY,20*scale,'rgba(113,201,182,.12)','#73b8ad',1.6);
 if(drone.burst>0)circle(droneX,droneY,26*scale,null,'rgba(150,240,215,'+(.35+.5*Math.min(1,drone.burst))+')',2.5);
 if(echoOn()){const gy=ys[drone.echoLane];ctx.save();ctx.globalAlpha=.3+.4*Math.min(1,drone.burst);ctx.setLineDash([4,4]);circle(droneX,gy,18*scale,null,'#96f0d7',1.8);ctx.setLineDash([]);ctx.translate(droneX,gy);ctx.rotate(Math.PI/4);rounded(-9*scale,-9*scale,18*scale,18*scale,3,null,'#96f0d7',1.8);ctx.restore();}
 ctx.save();ctx.translate(droneX,droneY);ctx.rotate(Math.PI/4);
 rounded(-12*scale,-12*scale,24*scale,24*scale,4,'#77b9ad','#ccebd6',2);
 rounded(-6*scale,-6*scale,12*scale,12*scale,2,'#244b50');ctx.restore();
 circle(droneX,droneY,4*scale,'#f4d5a0');
 // Tracers, explosion rings and particles share the same coordinate projection.
 for(const shot of shots){const a=map(shot.x,shot.y),b=map(shot.x2,shot.y2);ctx.globalAlpha=Math.min(1,shot.life/.13);line(a[0],a[1],b[0],b[1],'#fce6ab',Math.max(1.4,shot.thick*scale));}
 ctx.globalAlpha=1;
 for(const ring of alerts){const x=px(ring.y),y=ys[ring.lane];ctx.globalAlpha=Math.max(0,ring.life/.48);circle(x,y,Math.max(4,ring.r*.55*scale),null,'#ffe1aa',2.5);}
 ctx.globalAlpha=1;
 for(const p of particles){const xy=map(p.x,p.y);ctx.globalAlpha=Math.min(1,p.life*2.3);circle(xy[0],xy[1],Math.max(1.3,p.r*scale),p.color);}

 if(paused&&phase==='battle'){
  rect(0,0,w,h,'rgba(8,18,22,.67)');text('일시정지',w/2,h/2,25,'#ffe1ae','center',true);

function draw(now){syncCanvasMode();if(G3.active){try{G3.renderer.frame(now);return;}catch(e){console.warn('2.5D view stopped; using the 2D canvas.',e);G3.active=false;$('field').classList.remove('r3d-on');}}if(compactCanvas){drawCompact(now);return;}ctx.setTransform(classicSX,0,0,classicSY,0,0);drawBackdrop(now);drawIncoming();drawStations(now);drawTurrets(now);for(const e of enemies)drawEnemy(e,now);drawDrone(now);drawVfx();if(paused&&phase==='battle'){rect(0,61,480,H-61,'rgba(7,18,22,.65)');text('일시정지',240,DRONE_Y-8,31,'#f0d1a1','center',true);}}
function loop(timestamp){let dt=Math.min(.05,(timestamp-lastTime)/1000||0);lastTime=timestamp;frameTime=timestamp;if(settingsOpen){}else if(holdState)holdTick(dt);else if(phase==='battle'&&!paused){if(stopTick(dt)){}else if(drill)drillTick(dt);else{lessonTick(dt);update(dt*speed);}}draw(timestamp);if(timestamp-toastExpiry>0)$('toast').classList.remove('show');uiClock+=dt;if(uiClock>.12){updateUI();uiClock=0;}requestAnimationFrame(loop);}
$('pulseBtn').addEventListener('click',pulse);$('itemBtn').addEventListener('click',useItem);
function fieldTap(ev){if(settingsOpen){closeSettings();return;}if(holdState&&holdState.need==='tap'){if(performance.now()-holdState.t0>450)releaseHold();return;}if(phase!=='battle')return;if(G3.active&&G3.renderer.laneAt){switchLane(G3.renderer.laneAt(ev.clientX,ev.clientY));return;}const rect=canvas.getBoundingClientRect();if(compactCanvas){switchLane((ev.clientY-rect.top)<rect.height/2?0:1);}else{const x=(ev.clientX-rect.left)/rect.width*W;switchLane(x<W/2?0:1);}}
canvas.addEventListener('pointerdown',fieldTap);
/* Settings: opened with the gear, the P or Esc key, or the browser's back button. The game holds while it is open. */
function applyPrefs(){speed=prefs.speed;const f=prefs.bright===100?'':'brightness('+(prefs.bright/100)+')';for(const id of ['game','game3d'])if($(id))$(id).style.filter=f;
 for(const b of $('setSpeed').children)b.classList.toggle('on',+b.dataset.v===prefs.speed);
 for(const b of $('setVib').children)b.classList.toggle('on',(+b.dataset.v===1)===prefs.vib);

$('gearBtn').addEventListener('click',()=>settingsOpen?closeSettings():openSettings());$('setClose').addEventListener('click',closeSettings);

$('setVib').addEventListener('click',ev=>{const d=ev.target.dataset.v;if(d===undefined)return;prefs.vib=d==='1';savePrefs();applyPrefs();if(prefs.vib)buzz(40);});

$('setBright').addEventListener('input',ev=>{prefs.bright=+ev.target.value;savePrefs();applyPrefs();});
// Back button: one history entry is added on the first touch (browsers ignore entries added without one); going back opens or closes the settings instead of leaving.

window.addEventListener('keydown',ev=>{const k0=ev.key.toLowerCase();if(k0==='escape'||k0==='p'){ev.preventDefault();settingsOpen?closeSettings():openSettings();return;}if(settingsOpen)return;if(holdState&&holdState.need==='tap'){if((k0===' '||k0==='enter')&&performance.now()-holdState.t0>450){ev.preventDefault();releaseHold();}return;}if(phase!=='battle')return;const k=ev.key.toLowerCase();if(['arrowleft','arrowright',' ','a','d','p','f'].includes(k))ev.preventDefault();if(k==='a'||k==='arrowleft')switchLane(0);if(k==='d'||k==='arrowright')switchLane(1);if(k===' '||k==='f')pulse();});
